server.port=8000
# H2 (dev) — file-based so data survives restarts
spring.datasource.url=jdbc:h2:file:./data/tracocivil;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=tracocivil
spring.datasource.password=tracocivil
spring.jpa.hibernate.ddl-auto=update
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB
# JWT secret — OBRIGATÓRIO via env JWT_SECRET em produção. O valor abaixo é
# apenas fallback de dev; NUNCA use em produção (será rejeitado se fraco).
app.jwt.secret=${JWT_SECRET:traco-dev-secret-ONLY-FOR-LOCAL-DEV-DO-NOT-USE-IN-PROD}
app.jwt.expiration-ms=86400000
app.upload.dir=uploads
# Worker de visão computacional (packages/ai/worker.py) — vazio desativa e usa o simulador
app.ai.url=${AI_SERVICE_URL:http://127.0.0.1:8001}
# Token interno compartilhado com o worker Python (packages/ai). Em produção,
# gere um valor aleatório forte e defina o mesmo em WORKER_TOKEN no worker.
app.ai.token=${WORKER_TOKEN:}
app.cors.origins=http://localhost:3000,http://localhost:3001
# Hardening
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-stacktrace=never
server.error.include-exception=false
spring.jpa.open-in-view=false
# Flyway migrations (V1..V8 em db/migration) — desativado no dev porque
# ddl-auto=update já cria o schema; ativar em prod trocando para 'validate'/'migrate'
spring.flyway.enabled=false
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true