# Production profile (Postgres managed — Render/Railway/Fly.io)
spring.datasource.url=jdbc:${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
# Em produção, o schema é gerenciado EXCLUSIVAMENTE pelo Flyway (V1..V8).
# 'validate' garante que as entidades JPA batem com o banco sem alterar nada.
spring.jpa.hibernate.ddl-auto=validate
spring.h2.console.enabled=false
# Flyway: roda as migrations V1..V8 na ordem ao subir. baseline-on-migrate
# permite adotar um banco já existente; em banco novo ele cria do zero.
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.validate-on-migrate=true
app.jwt.secret=${JWT_SECRET}
app.cors.origins=${CORS_ORIGINS:http://localhost:3000}
# Worker CV (serviço traco-ai no Render) — vazio cai no simulador
app.ai.url=${AI_SERVICE_URL:}
server.forward-headers-strategy=native
server.error.include-message=never
server.error.include-stacktrace=never