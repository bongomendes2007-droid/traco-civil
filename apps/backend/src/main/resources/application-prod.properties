# Production profile (Postgres managed — Supabase Connection Pooler, Transaction mode)
# Transaction pooler NÃO suporta prepared statements — prepareThreshold=0 é obrigatório.
# Formato do usuário: <project-ref>.<user> (ex: app_user.khpmbksseiwmaurxtxwk)
spring.datasource.url=jdbc:postgresql://aws-0-sa-east-1.pooler.supabase.com:6543/postgres?prepareThreshold=0&sslmode=require
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP ajustes para Transaction pooler:
# - disableConnectionTracking: evita rastreamento de conexão (pooler não mantém estado)
# - maxLifetime menor que o timeout do pooler (Supabase default: 30min)
spring.datasource.hikari.max-lifetime=1200000
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2

# Hibernate: prepared statements desabilitados via prepareThreshold=0 na URL JDBC.
# plan_cache_max_size precisa ser > 0 (Hibernate exige capacity >= 2*concurrencyLevel).
spring.jpa.properties.hibernate.query.plan_cache_max_size=8
spring.jpa.properties.hibernate.query.plan_parameter_metadata_max_size=8

# Em produção, o schema é gerenciado EXCLUSIVAMENTE pelo Flyway (V1..V8).
# 'validate' garante que as entidades JPA batem com o banco sem alterar nada.
spring.jpa.hibernate.ddl-auto=validate
spring.h2.console.enabled=false

# Flyway DESATIVADO em produção: migrations são aplicadas via script Python
# (run_migrations_supabase.py) usando o role postgres (owner das tabelas).
# O backend conecta como app_user (RLS), que não tem permissão de DDL.
# Para novas migrations, rode o script Python antes do deploy.
spring.flyway.enabled=false

app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=3600000
app.cors.origins=${CORS_ORIGINS:http://localhost:3000}

# Worker CV (serviço traco-ai no Render) — vazio cai no simulador
app.ai.url=${AI_SERVICE_URL:}

server.forward-headers-strategy=native
server.error.include-message=never
server.error.include-stacktrace=never