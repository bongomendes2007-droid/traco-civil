<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet data-dc-atomics>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box}
  body{margin:0;background:#f7f6f2;font-family:'Space Grotesk',system-ui,sans-serif;color:#111110;-webkit-font-smoothing:antialiased}
  a{color:inherit;text-decoration:none}
  .pj-filt{padding:8px 16px;border-radius:999px;font-size:13px;font-weight:600;cursor:pointer;border:1px solid #e2e0da;background:#fff;color:#6f6f69}
  .pj-filt.on{background:#111110;color:#fff;border-color:#111110}
</style>
</helmet>
<div style="width:1180px;max-width:1180px;margin:0 auto;padding:44px 40px">
  <div style="display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:32px">
    <div>
      <h1 style="font-size:38px;font-weight:700;letter-spacing:-.02em;margin:0 0 6px">Meus Projetos</h1>
      <p style="font-family:'Space Mono',monospace;font-size:13px;color:#9a9a95;margin:0">4 projetos · 2 ativos</p>
    </div>
    <a href="#" style="display:inline-flex;align-items:center;gap:9px;background:{{ accent }};color:#111110;font-size:15px;font-weight:700;padding:13px 22px;border-radius:12px">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>Novo Projeto
    </a>
  </div>

  <div style="display:flex;align-items:center;gap:14px;margin-bottom:26px">
    <div style="flex:1;max-width:420px;display:flex;align-items:center;gap:10px;background:#fff;border:1px solid #e2e0da;border-radius:12px;padding:12px 16px">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#9a9a95" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4-4"/></svg>
      <span style="font-size:14px;color:#9a9a95">Buscar projetos...</span>
    </div>
    <div class="pj-filt on">Todos</div>
    <div class="pj-filt">Ativos</div>
    <div class="pj-filt">Concluídos</div>
  </div>

  <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:20px">
    <sc-for list="{{ projects }}" as="p">
      <div style="background:#fff;border:1px solid #e2e0da;border-radius:18px;padding:22px;display:flex;flex-direction:column">
        <div style="display:flex;align-items:flex-start;gap:13px;margin-bottom:16px">
          <span style="width:44px;height:44px;border-radius:11px;background:#fbeee7;color:{{ accent }};display:flex;align-items:center;justify-content:center;flex:none">{{ p.icon }}</span>
          <div style="min-width:0">
            <div style="font-size:18px;font-weight:700;line-height:1.2">{{ p.name }}</div>
            <div style="font-family:'Space Mono',monospace;font-size:12px;color:#9a9a95;margin-top:3px">{{ p.type }}</div>
          </div>
        </div>
        <div style="display:flex;align-items:center;gap:10px;margin-bottom:18px">
          <span style="font-family:'Space Mono',monospace;font-size:11px;font-weight:700;padding:4px 9px;border-radius:6px;background:{{ p.badgeBg }};color:{{ p.badgeFg }}">{{ p.status }}</span>
          <span style="font-family:'Space Mono',monospace;font-size:12px;color:#9a9a95">{{ p.plants }}</span>
        </div>
        <div style="display:flex;flex-direction:column;gap:11px;padding-bottom:16px;border-bottom:1px solid #f0efec">
          <div style="display:flex;align-items:center;justify-content:space-between">
            <span style="display:flex;align-items:center;gap:8px;font-size:13px;color:#8a8a85"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>Criado em</span>
            <span style="font-family:'Space Mono',monospace;font-size:13px;font-weight:600">{{ p.created }}</span>
          </div>
          <div style="display:flex;align-items:center;justify-content:space-between">
            <span style="display:flex;align-items:center;gap:8px;font-size:13px;color:#8a8a85"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/></svg>Última análise</span>
            <span style="font-family:'Space Mono',monospace;font-size:13px;font-weight:600">{{ p.last }}</span>
          </div>
          <div style="display:flex;align-items:center;justify-content:space-between">
            <span style="display:flex;align-items:center;gap:8px;font-size:13px;color:#8a8a85"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 17l6-6 4 4 8-8"/><path d="M17 7h4v4"/></svg>Orçamento est.</span>
            <span style="font-family:'Space Mono',monospace;font-size:14px;font-weight:700;color:{{ p.budgetColor }}">{{ p.budget }}</span>
          </div>
        </div>
        <div style="display:flex;align-items:center;gap:10px;margin-top:16px">
          <a href="#" style="flex:1;text-align:center;border:1.5px solid #111110;font-size:14px;font-weight:600;padding:11px;border-radius:11px">Ver Detalhes</a>
          <a href="#" style="width:42px;height:42px;border:1px solid #e2e0da;border-radius:11px;display:flex;align-items:center;justify-content:center;color:#9a9a95"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/></svg></a>
        </div>
      </div>
    </sc-for>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1180,&quot;height&quot;:740},&quot;accent&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#ff5a1f&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;options&quot;:[&quot;#ff5a1f&quot;,&quot;#c6f24e&quot;,&quot;#f97316&quot;,&quot;#111110&quot;]}}">
class Component extends DCLogic {
  renderVals() {
    const accent = this.props.accent ?? "#ff5a1f";
    const home = React.createElement("svg",{width:20,height:20,viewBox:"0 0 24 24",fill:"none",stroke:"currentColor",strokeWidth:2,strokeLinecap:"round",strokeLinejoin:"round"},React.createElement("path",{d:"M3 10l9-7 9 7v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"}),React.createElement("path",{d:"M9 21V12h6v9"}));
    const bldg = React.createElement("svg",{width:20,height:20,viewBox:"0 0 24 24",fill:"none",stroke:"currentColor",strokeWidth:2,strokeLinecap:"round",strokeLinejoin:"round"},React.createElement("rect",{x:4,y:2,width:16,height:20,rx:1}),React.createElement("path",{d:"M9 6h1M14 6h1M9 10h1M14 10h1M9 14h1M14 14h1M10 22v-4h4v4"}));
    const fact = React.createElement("svg",{width:20,height:20,viewBox:"0 0 24 24",fill:"none",stroke:"currentColor",strokeWidth:2,strokeLinecap:"round",strokeLinejoin:"round"},React.createElement("path",{d:"M2 20h20V9l-6 4V9l-6 4V4H2z"}));
    const active = {status:"Ativo", badgeBg:accent, badgeFg:"#111110"};
    const done = {status:"Concluído", badgeBg:"#eaf7e6", badgeFg:"#2f7d32"};
    const draft = {status:"Rascunho", badgeBg:"#eeede9", badgeFg:"#9a9a95"};
    const projects = [
      {name:"Residencial Alpha", type:"Residencial", icon:home, plants:"3 plantas", created:"12 Ago 2026", last:"2h atrás", budget:"R$ 287.540", budgetColor:accent, ...active},
      {name:"Edifício Comercial Beta", type:"Comercial", icon:bldg, plants:"5 plantas", created:"08 Ago 2026", last:"1 dia atrás", budget:"R$ 1.245.000", budgetColor:accent, ...active},
      {name:"Galpão Industrial Gamma", type:"Industrial", icon:fact, plants:"2 plantas", created:"01 Ago 2026", last:"3 dias atrás", budget:"R$ 890.300", budgetColor:accent, ...done},
      {name:"Casa Térrea Delta", type:"Residencial", icon:home, plants:"1 planta", created:"14 Ago 2026", last:"Nunca analisado", budget:"—", budgetColor:"#c9c6bd", ...draft},
    ];
    return { accent, projects };
  }
}
</script>
</body>
</html>
